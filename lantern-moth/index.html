<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="robots" content="noindex, nofollow" /><!-- Poki 심사용 미리보기(비공개 링크) — 검색 노출 금지 -->
    <meta charset="UTF-8" />
    <!-- 모바일: 확대/축소 막고 화면 폭에 맞춤. viewport-fit=cover 로 노치 영역까지 사용 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Lantern Moth — light and snuff the lanterns to guide a moth through the night to its window. You never touch the moth, only the lights." />
    <link rel="icon" href="data:," /><!-- favicon 404 콘솔 에러 방지 -->
    <title>Lantern Moth</title>

    <link rel="preload" href="./assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/yuji-syuku-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* 게임 전용 디스플레이 폰트(OFL, 로컬 번들 — 외부 요청 0). game.js 가 부팅 전에 document.fonts.load 로 대기. */
      /* 제목·밤 이름용 디스플레이 폰트(붓맛, OFL) — 라틴 서브셋만 로컬. CJK 제목은 시스템 폰트 폴백 */
      @font-face { font-family: 'Yuji Syuku'; src: url('./assets/fonts/yuji-syuku-latin.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat'; src: url('./assets/fonts/montserrat-latin.woff2') format('woff2'); font-weight: 400 900; font-style: normal; font-display: block; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Montserrat'; src: url('./assets/fonts/montserrat-latin-ext.woff2') format('woff2'); font-weight: 400 900; font-style: normal; font-display: block; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Montserrat'; src: url('./assets/fonts/montserrat-cyrillic.woff2') format('woff2'); font-weight: 400 900; font-style: normal; font-display: block; unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #070a1a url('./assets/letterbox.jpg') center / cover no-repeat; /* 1.2b: 데스크톱 레터박스를 미리 어둡게 흐린 배경으로 채움(가상 요소 오버레이는 광고 막 터치를 가로채므로 금지) */
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
      }
      /*
        레터박스 중앙정렬 (GD 반려 사유 ① 센터링).
        - position:fixed + inset:0 로 뷰포트를 100% 정확히 덮는다(100vw 는 스크롤바 폭 포함, 100vh 는 모바일 툴바 무시 — 둘 다 안 씀).
        - 정렬은 CSS flex 에만 맡기고 Phaser 는 autoCenter: NO_CENTER (둘 다 켜면 margin+flex 여백이 겹쳐 한쪽으로 쏠림).
        - 캔버스 '크기'는 Phaser Scale.FIT 이 계산하되, 부모 크기는 shared/gd-flow.js 가 레이아웃 확정 후
          직접 측정해 setParentSize() 로 밀어넣는다(FIT 의 '한 프레임 늦은 부모 크기' 버그 우회).
      */
      #game-container {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #game-container canvas {
        display: block;
        margin: 0;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <!-- 광고 대기/재개/회전 안내 오버레이(DOM)는 shared/gd-flow.js 가 여기 주입한다 -->

    <!-- Phaser 3 (로컬 번들, 전역 window.Phaser) -->
    <script src="./shared/vendor/phaser.min.js"></script>

    <!-- 게임 로직 (ES 모듈: ./shared/ 모듈을 import). ?v= 캐시버스팅 — 릴리스마다 올릴 것 -->
    <script type="module" src="./game.js?v=24"></script>
  </body>
</html>
